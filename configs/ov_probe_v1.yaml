experiment:
  name: ov_probe_v1
  seed: 42
  overwrite: false

paths:
  # Put machine-specific read-only paths in an ignored *.local.yaml copy.
  source_project_root: null
  remoteclip_checkpoint: null
  remoteclip_source_root: null
  text_feature_cache: inputs/first_paper_snapshot_20260812/remoteclip_text_features.npz
  # Read-only snapshots copied from the exact recorded remote outputs; JSON provenance is intact.
  single_prototype_file: inputs/first_paper_snapshot_20260812/visual_prototypes.json
  multi_prototype_file: inputs/first_paper_snapshot_20260812/main_v2_multi_prototypes.json
  region_feature_cache: null
  weak_region_label_file: null
  output_root: outputs/ov_probe_v1

text_encoding:
  mode: cached
  remote_host: null
  remote_python: null
  remote_checkpoint: null

model:
  model_name: ViT-B-32
  feature_dim: 512
  device: auto
  normalize_features: true
  text_batch_size: 128

data:
  dataset_name: LoveDA
  split: train
  use_validation_set: false
  allow_pixel_gt: false
  allow_oracle: false
  require_provenance: true
  classes:
    - {id: 1, name: building}
    - {id: 2, name: road}
    - {id: 3, name: water}
    - {id: 4, name: barren}
    - {id: 5, name: forest}
    - {id: 6, name: agriculture}

prompts:
  group_a_templates:
    - "{class}"
    - "a photo of {class}"
    - "an aerial image of {class}"
    - "a satellite image of {class}"
    - "a remote sensing image of {class}"
    - "{class} in an aerial image"
    - "{class} in a satellite image"
    - "a region of {class} viewed from above"
  group_b_templates:
    - "{alias}"
    - "an aerial image of {alias}"
    - "a remote sensing image of {alias}"
  aliases:
    building: [building, buildings, built-up area, urban structures]
    road: [road, roads, street, paved road]
    water: [water, water body, river or lake]
    barren: [barren land, bare soil, exposed ground]
    forest: [forest, woodland, dense tree-covered area]
    agriculture: [agriculture, agricultural land, cropland, farmland, cultivated field]
  distractors:
    - airport
    - bridge
    - railway
    - parking lot
    - ship
    - wetland
    - grassland
    - industrial area
    - residential area
    - sports field
    - mountain
    - sand
    - snow
    - cloud
    - vehicle

evaluation:
  aggregation: [single, max, mean, logsumexp]
  logsumexp_temperature: 0.07
  topk: [1, 3, 5]
  vocabularies: [closed, expanded]
  region_sample_per_class: null
  predeclared_confusions:
    barren: [agriculture, road, sand]
    forest: [agriculture, grassland, wetland]
    agriculture: [barren, forest, grassland]
    road: [railway, parking lot, bridge]
    water: [wetland]
    building: [residential area, industrial area]
