[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ov-probe"
version = "0.1.0"
description = "Read-only Stage 0 region/prototype-text alignment probe for OV-WSSS"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "PyYAML", "matplotlib", "seaborn", "torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
